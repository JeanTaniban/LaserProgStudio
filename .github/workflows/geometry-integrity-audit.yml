name: geometry-integrity-audit

on:
  push:
    branches:
      - leane/geometry-integrity-foundation-cdc
      - leane/fix-mask-2d-subpixel
  workflow_dispatch:

jobs:
  geometry-audit:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8" "zstandard>=0.23,<1"

      - name: Run targeted geometry regressions
        continue-on-error: true
        run: python -m pytest -q --junitxml=targeted-geometry-tests.xml tests/test_pass161_simplify_creator_api_migration.py tests/test_pass249_simplify_mesh_product_ui.py tests/test_pass250_hollow_mesh_product_ui.py tests/test_pass251_split_mesh_product_ui.py tests/test_vent_mesh_material_footprint_pass50.py tests/test_pass242_vent_generator_apply_preflight.py tests/test_v174_joint_builder_boolean_topology_contract.py tests/test_v175_boolean_geometric_source_contract.py tests/test_v179_plan_tracer_performance_safety.py tests/test_v96_plan_tracer_boolean_manifold_fix.py tests/test_pass309_boolean_chained_plan_tracer_merge.py tests/test_pass327_folding_curve_deformation.py tests/test_pass82_acoustic_diffuser_tool.py

      - name: Run geometry integrity runtime probe
        if: always()
        run: python scripts/geometry_integrity_probe.py > geometry-integrity-probe.json

      - name: Inventory geometry mutation bypasses
        if: always()
        run: python scripts/audit_geometry_mutation_bypasses.py > geometry-mutation-bypasses.txt

      - name: Measure project save lifecycle retention
        if: always()
        run: python scripts/project_save_lifecycle_probe.py > project-save-lifecycle.json

      - name: Audit 2D mask vectorization and smoothing
        if: always()
        run: python scripts/mask_2d_quality_probe.py > mask-2d-quality.json

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-integrity-audit-${{ runner.os }}
          path: |
            geometry-integrity-probe.json
            targeted-geometry-tests.xml
            geometry-mutation-bypasses.txt
            project-save-lifecycle.json
            mask-2d-quality.json

      - name: Run full project quality gate
        if: (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/leane/fix-mask-2d-subpixel') && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: python scripts/quality_gate.py --with-tests --pytest-args -q
