name: mask-2d-audit

on:
  push:
    branches:
      - leane/geometry-integrity-foundation-cdc
      - leane/fix-mask-2d-subpixel
    paths:
      - 'scripts/mask_2d_quality_probe.py'
      - 'src/laserprog_studio/geometry_ops/image_mask_relief*.py'
      - 'src/laserprog_studio/controllers/image_mask_import.py'
      - 'tests/test_image_mask_relief_import.py'
      - 'tests/test_mask_relief_boolean_merge_policy.py'
      - 'tests/test_mask_subpixel_contour.py tests/test_mask_subpixel_edge_cases.py'
      - 'tests/test_mask_subpixel_edge_cases.py'
      - '.github/workflows/mask-2d-audit.yml'
  workflow_dispatch:

jobs:
  mask-audit:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8"

      - name: Run mask regression tests
        run: python -m pytest -q tests/test_image_mask_relief_import.py tests/test_mask_relief_boolean_merge_policy.py tests/test_mask_subpixel_contour.py

      - name: Run mask quality probe
        run: python scripts/mask_2d_quality_probe.py > mask-2d-quality.json

      - name: Upload mask evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mask-2d-quality-${{ runner.os }}
          path: mask-2d-quality.json
